# BEGIN PUBLIC YOUTUBE KIT
. /opt/zapret2/yt-kit/scope.sh
FWTYPE=nftables
POSTNAT=1
INIT_APPLY_FW=1
QNUM=300
NFQWS2_ENABLE=$KIT_ENABLED
NFQWS2_PORTS_TCP=443
NFQWS2_PORTS_UDP=443
NFQWS2_TCP_PKT_OUT=20
NFQWS2_TCP_PKT_IN=0
NFQWS2_UDP_PKT_OUT=5
NFQWS2_UDP_PKT_IN=0
NFQWS2_PORTS_TCP_KEEPALIVE=
NFQWS2_PORTS_UDP_KEEPALIVE=
DESYNC_MARK=0x40000000
DESYNC_MARK_POSTNAT=0x20000000
FILTER_MARK=0x10000000
MODE_FILTER=hostlist
DISABLE_IPV4=0
DISABLE_IPV6=1
DISABLE_CUSTOM=0
FLOWOFFLOAD=software
GETLIST=
FILTER_TTL_EXPIRED_ICMP=0
if [ -r /tmp/yt-kit/trial.conf ]; then
    . /tmp/yt-kit/trial.conf
else
    . /opt/zapret2/yt-kit/active.conf
fi
NFQWS2_OPT=$(printf '%s' "$NFQWS2_OPT" | sed 's|<HOSTLIST_NOAUTO>|--hostlist=/opt/zapret2/yt-kit/youtube-hosts.txt|g;s|<HOSTLIST>|--hostlist=/opt/zapret2/yt-kit/youtube-hosts.txt|g')
# END PUBLIC YOUTUBE KIT
